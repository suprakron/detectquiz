{% extends 'quiz/base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/quiz/teacher.css' %}">
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card shadow-lg border-0 rounded-4 p-4">
        <h3 class="text-center text-primary mb-4 fw-bold">
            <i class="bi bi-bar-chart-line-fill me-2"></i> ผลคะแนนของ {{ student.username }}
        </h3>

        <canvas id="scoreChart" height="150"></canvas>

        <div class="text-center mt-4">
            <a href="{% url 'teacher_dashboard' %}" class="btn btn-outline-secondary fw-bold">
                <i class="bi bi-arrow-left me-1"></i> กลับ
            </a>
        </div>
    </div>
</div>

<!-- ✅ ฝัง JSON แบบปลอดภัย -->
<script id="chart-data" type="application/json">
{
    "labels": {{ labels|safe }},
    "scores": {{ scores|safe }},
    "behavior_scores": {{ behavior_scores|safe }},
    "midterm_scores": {{ midterm_scores|safe }},
    "final_scores": {{ final_scores|safe }},
    "assignment_scores": {{ assignment_scores|safe }}
}
</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const data = JSON.parse(document.getElementById('chart-data').textContent);

    const ctx = document.getElementById('scoreChart').getContext('2d');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: data.labels,
            datasets: [
                { label: 'คะแนนรวม', data: data.scores, backgroundColor: 'rgba(54, 162, 235, 0.7)' },
                { label: 'พฤติกรรม', data: data.behavior_scores, backgroundColor: 'rgba(255, 206, 86, 0.7)' },
                { label: 'กลางภาค', data: data.midterm_scores, backgroundColor: 'rgba(75, 192, 192, 0.7)' },
                { label: 'ปลายภาค', data: data.final_scores, backgroundColor: 'rgba(255, 99, 132, 0.7)' },
                { label: 'งานที่มอบหมาย', data: data.assignment_scores, backgroundColor: 'rgba(153, 102, 255, 0.7)' }
            ]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'top' },
                title: {
                    display: true,
                    text: 'ผลคะแนนของนักเรียน'
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    max: 100
                }
            }
        }
    });
});
</script>
{% endblock %}
