{% extends 'quiz/base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/quiz/teacher.css' %}">
{% endblock %}

{% block content %}
<div class="teacher-dashboard py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
 
      <div class="card shadow-lg rounded-4 border-0 p-5 animate__animated animate__fadeIn">
        <h3 class="text-center text-primary fw-bold mb-5">
          <i class="bi bi-file-earmark-text me-2"></i> สร้างแบบทดสอบใหม่
        </h3>

        <form method="post" class="needs-validation" novalidate>
          {% csrf_token %}

          {% for field in form %}
          <div class="form-floating mb-4">
            {{ field }}
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {% if field.errors %}
              <div class="invalid-feedback d-block">
                {{ field.errors|striptags }}
              </div>
            {% endif %}
          </div>
          {% endfor %}

          <div class="d-flex justify-content-between mt-4">
            <button type="submit" class="btn btn-gradient-primary fw-bold">
              <i class="bi bi-check-circle me-1"></i> บันทึก
            </button>
            <a href="{% url 'teacher_dashboard' %}" class="btn btn-outline-secondary fw-bold">
              <i class="bi bi-arrow-left me-1"></i> กลับ
            </a>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
{% endblock %}
